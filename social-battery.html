<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>你的社交电量还剩几格？｜3 分钟趣味测试</title>
<meta name="description" content="10 个真实生活场景，测出你的人际耗电模式。结果可保存成图分享。" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07070b;--ink:#f4f4f7;--dim:rgba(244,244,247,.52);--line:rgba(255,255,255,.10);
  --accent:#d9ff4a;color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;padding:24px 20px 44px;min-height:100vh;display:flex;flex-direction:column;position:relative}
.glow{position:fixed;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(217,255,74,.14),rgba(217,255,74,0) 68%);pointer-events:none;z-index:0}
.top{position:relative;z-index:1;display:flex;align-items:baseline;gap:10px;padding-bottom:8px}
.brand{font-size:15px;font-weight:800;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--dim);letter-spacing:1px}
.screen{position:relative;z-index:1;animation:in .34s cubic-bezier(.2,.7,.3,1) both;flex:1;display:flex;flex-direction:column}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tagline{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--accent);border:1px solid rgba(217,255,74,.28);background:rgba(217,255,74,.06);padding:7px 12px;border-radius:99px;align-self:flex-start;margin-top:26px}
h1{font-size:33px;line-height:1.32;font-weight:800;letter-spacing:-.5px;margin:16px 0 14px}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:15px;line-height:1.75;color:rgba(244,244,247,.72)}
.metas{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
.meta{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:8px 12px;border-radius:10px}
.spacer{flex:1}
.steps{margin-top:30px;display:flex;flex-direction:column;gap:15px}
.st{border-left:2px solid rgba(255,255,255,.16);padding-left:14px;display:flex;gap:10px;align-items:baseline}
.st b{font-size:10px;letter-spacing:1.5px;color:var(--accent);font-weight:800;flex:none}
.st span{font-size:13px;color:rgba(244,244,247,.62);line-height:1.5}
.foot{font-size:11px;line-height:1.7;color:rgba(244,244,247,.34);margin-top:22px}
.bar{height:3px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.3,.8,.2,1)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;color:var(--dim)}
.qtop b{color:var(--accent);font-size:20px;font-weight:800}
.q{font-size:21px;line-height:1.58;font-weight:650;margin:22px 0 20px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:16px 17px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.028);color:var(--ink);font-size:15.5px;line-height:1.5;font-family:inherit;transition:all .18s ease;cursor:pointer}
.opt em{font-style:normal;font-size:12px;font-weight:800;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:3px 7px;flex:none;margin-top:1px}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:rgba(217,255,74,.62);background:rgba(217,255,74,.11)}
.opt.sel em{color:var(--accent);border-color:rgba(217,255,74,.5)}
.back{background:none;border:0;color:var(--dim);font-size:13px;font-family:inherit;padding:16px 0;cursor:pointer;text-align:left}
.card{border-radius:24px;padding:26px 22px 22px;background:radial-gradient(130% 90% at 88% -10%,rgba(217,255,74,.17),rgba(217,255,74,0) 58%),linear-gradient(165deg,#141419,#0a0a0e);border:1px solid rgba(255,255,255,.11);position:relative;overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
.card:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 120%,rgba(255,255,255,.05),transparent 55%);pointer-events:none}
.cardh{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.33);font-weight:700}
.numrow{display:flex;align-items:flex-end;gap:10px;margin-top:16px}
.big{font-size:62px;font-weight:800;line-height:.92;color:var(--accent);letter-spacing:-3px;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:rgba(244,244,247,.55);margin-bottom:9px;letter-spacing:1px}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin:16px 0 20px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.name{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.quote{font-size:15.5px;line-height:1.75;color:rgba(244,244,247,.72);margin-top:12px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.tag{font-size:11px;padding:6px 11px;border-radius:99px;border:1px solid rgba(217,255,74,.32);background:rgba(217,255,74,.07);color:var(--accent);letter-spacing:.5px}
.sec{font-size:10px;letter-spacing:2.5px;color:rgba(255,255,255,.3);font-weight:700;margin:26px 0 12px}
.li{display:flex;gap:10px;font-size:14.5px;line-height:1.68;color:rgba(244,244,247,.8);margin-bottom:11px}
.li i{font-style:normal;color:var(--accent);font-weight:800;font-size:12px;flex:none;margin-top:3px}
.note{border-left:2px solid rgba(217,255,74,.4);padding:12px 0 12px 14px;font-size:14px;line-height:1.72;color:rgba(244,244,247,.86);background:linear-gradient(90deg,rgba(217,255,74,.05),transparent)}
.note b{color:var(--accent);font-weight:700}
.btn{width:100%;padding:16px;border-radius:15px;border:0;background:var(--accent);color:#0a0a0a;font-size:15.5px;font-weight:750;font-family:inherit;margin-top:11px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(3,3,6,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:22px;z-index:99}
.ov.on{display:flex}
.ovbox{max-width:360px;width:100%;text-align:center}
.ovbox img{width:100%;border-radius:18px;box-shadow:0 30px 80px -20px #000}
.ovbox p{font-size:12.5px;color:var(--dim);margin:14px 0 2px;line-height:1.6}
</style>

<script>

    ['电梯里遇到不太熟的同事，你会——', [['主动开口，一直聊到出电梯', 4], ['点头微笑，说一句「早」', 3], ['低头假装看手机', 2], ['盯着楼层数字，祈祷他先到', 1]]],
    ['聚会结束回到家，你通常是——', [['意犹未尽，还想再约一场', 4], ['挺开心，但需要先躺一会儿', 3], ['脑子嗡嗡的，一句话都不想说', 2], ['已经开始盘算下次怎么推掉', 1]]],
    ['你的微信消息习惯是——', [['基本秒回，语音条也敢发', 4], ['看到就回，忙就晚点回', 3], ['先攒着，等有精神了一次回', 2], ['看一眼，心里回了，手上没回', 1]]],
    ['一个人待一整天，你会——', [['有点无聊，想找人说话', 4], ['上午很爽，下午开始想约人', 3], ['刚刚好，很舒服', 2], ['这是我理想的休息方式', 1]]],
    ['在朋友的朋友的生日局上，你——', [['很快能和陌生人聊起来', 4], ['跟着朋友，被介绍才开口', 3], ['找个角落，安静地吃东西', 2], ['全程看手机，等结束', 1]]],
    ['你最怕的电话是——', [['其实还好，电话比打字高效', 4], ['陌生号码会犹豫一下', 3], ['熟人打来也要先深吸一口气', 2], ['所有电话，包括外卖', 1]]],
    ['有人找你倾诉烦心事，你会——', [['直接打过去，陪他聊一小时', 4], ['认真打字安慰，约他出来吃饭', 3], ['想帮，但不知道说什么，发个表情包', 2], ['心里很关心，但更想给他空间', 1]]],
    ['你的社交状态最像——', [['白天满格，晚上还能续', 4], ['满格出门，回家路上掉一半', 3], ['出门前 80%，回来剩 5%', 2], ['长期低电量，只对三个人开放', 1]]],
    ['如果明天多出一天假，你会——', [['立刻组局，把人都叫出来', 4], ['约一两个人吃饭，其余自己待着', 3], ['谁都不见，在家躺平', 2], ['关掉手机，去一个没人认识我的地方', 1]]]
  ],

    { min: 24, max: 28, pct: 65, name: '可切换型社牛', quote: '我能撑起一个场子，但散场后要一整晚来回血。', tags: ['场面人', '会照顾人', '回家瘫'],
      feat: ['你总能第一个破冰，也总在散场后突然沉默。', '你很会接话，其实一半注意力在观察谁被冷落。', '别人以为你精力旺盛，只有你知道回家那一路有多空。'], good: '你是那种让所有人都舒服的人，这是很难的本事。', twist: '你不是天生外向，你只是不忍心让场子冷下来。' },
    { min: 29, max: 33, pct: 82, name: '社交充电宝', quote: '人越多我越亮，独处反而像断电。', tags: ['自来熟', '组局人', '情绪供给'],
      feat: ['置顶的群，比你通讯录分组还多。', '周末如果没人约，你会有点慌。', '朋友难过第一个找你，你也很擅长把人哄好。'], good: '你身上有温度，靠近你的人会不自觉地放松。', twist: '你一直在给别人充电，也要记得——自己不是插座。' },
    { min: 34, max: 40, pct: 97, name: '社交永动机', quote: '只要有人在，我就不需要休息。', tags: ['全场焦点', '高频在线', '不怕冷场'],
      feat: ['能从下午聊到凌晨，第二天照样上班。', '朋友圈一天三条，每条都有人回。', '安静的房间待超过两小时，你开始找事做。'], good: '你的生命力很打眼，你在的地方不会无聊。', twist: '你不是不怕孤独，你只是不敢停下来听自己的声音。' }
  ]
};
var idx = -1, ans = [], total = 0;
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;') }
function render(){
  var s = document.getElementById('screen');
  if (idx < 0) { s.innerHTML = introHTML(); }
  else if (idx >= CFG.qs.length) { s.innerHTML = resultHTML(); requestAnimationFrame(function(){ var el = document.getElementById('pbfill'); if (el) el.style.width = totalPct() + '%'; }); }
  else { s.innerHTML = qHTML(); }
  window.scrollTo(0, 0);
}
function introHTML(){
  return '<div class="tagline">' + CFG.en + ' · 趣味自测</div>'
    + '<h1>' + CFG.title + '</h1>'
    + '<p class="lead">' + CFG.lead + '</p>'
    + '<div class="metas">' + CFG.meta.map(function(m){ return '<span class="meta">' + m + '</span>' }).join('') + '</div>'
    + '<div class="steps">'
    + '  <div class="st"><b>01</b><span>凭第一反应，选 10 个真实场景</span></div>'
    + '  <div class="st"><b>02</b><span>看你的社交电量，和它背后的原因</span></div>'
    + '  <div class="st"><b>03</b><span>保存结果卡，直接发朋友圈</span></div>'
    + '</div>'
    + '<div class="spacer"></div>'
    + '<button class="btn" onclick="start()">开始测试</button>'
    + '<p class="foot">选第一反应，不要想太久，越犹豫越不准。<br/>结果仅供娱乐与自我观察，不构成心理诊断。</p>';
}
function qHTML(){
  var q = CFG.qs[idx];
  var pct = Math.round(idx / CFG.qs.length * 100);
  var opts = q[1].map(function(o, i){
    var L = ['A','B','C','D'][i];
    var sel = ans[idx] === o[1] ? ' sel' : '';
    return '<button class="opt' + sel + '" onclick="pick(' + o[1] + ',this)"><em>' + L + '</em><span>' + esc(o[0]) + '</span></button>';
  }).join('');
  return '<div class="bar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="qtop" style="margin-top:16px"><span>QUESTION</span><b>0' + (idx + 1) + ' / ' + CFG.qs.length + '</b></div>'
    + '<div class="q">' + esc(q[0]) + '</div>'
    + '<div class="opts">' + opts + '</div>'
    + (idx > 0 ? '<button class="back" onclick="prev()">← 上一题</button>' : '<div style="height:16px"></div>');
}
function totalPct(){
  var b = getBand();
  return b ? b.pct : 0;
}
function getBand(){
  var sum = 0;
  for (var i = 0; i < CFG.qs.length; i++) sum += (ans[i] || 1);
  total = sum;
  for (var j = 0; j < CFG.bands.length; j++) { if (sum >= CFG.bands[j].min && sum <= CFG.bands[j].max) return CFG.bands[j]; }
  return CFG.bands[CFG.bands.length - 1];
}
function resultHTML(){
  var b = getBand();
  return '<div style="height:8px"></div>'
    + '<div class="card">'
    + '  <div class="cardh"><span>' + CFG.en + ' · ' + CFG.no + '</span><span>RESULT</span></div>'
    + '  <div class="numrow"><span class="big">' + b.pct + '%</span><span class="unit">' + CFG.unit + '</span></div>'
    + '  <div class="pbar"><i id="pbfill" style="width:0"></i></div>'
    + '  <div class="name">' + b.name + '</div>'
    + '  <div class="quote">「' + b.quote + '」</div>'
    + '  <div class="tags">' + b.tags.map(function(t){ return '<span class="tag">' + t + '</span>' }).join('') + '</div>'
    + '  <div class="sec">你大概率是这样的</div>'
    + '  ' + b.feat.map(function(f, i){ return '<div class="li"><i>0' + (i + 1) + '</i><span>' + f + '</span></div>' }).join('')
    + '  <div class="sec">被说中的地方</div>'
    + '  <div class="note"><b>隐藏优势：</b>' + b.good + '<br/><br/><b>温柔一刀：</b>' + b.twist + '</div>'
    + '</div>'
    + '<button class="btn" onclick="saveCard()">保存结果卡（无水印）</button>'
    + '<button class="btn ghost" onclick="copyShare()">复制分享文案</button>'
    + '<button class="btn ghost" onclick="restart()">再测一次</button>'
    + '<p class="foot">' + b.name + ' · 本结果由你的 ' + CFG.qs.length + ' 个选择生成，仅供娱乐。</p>';
}
function start(){ ans = []; idx = 0; render(); }
function prev(){ if (idx > 0) { idx--; render(); } }
function pick(v, el){
  ans[idx] = v;
  var els = document.querySelectorAll('.opt');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('sel');
  el.classList.add('sel');
  setTimeout(function(){
    if (idx < CFG.qs.length - 1) { idx++; render(); }
    else { idx = CFG.qs.length; render(); }
  }, 300);
}
function restart(){ idx = -1; ans = []; total = 0; render(); }
function hexA(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function balance(ctx, text, maxW){
  var noStart = '。，、」』！？：；）】…';
  var marks = '，。、；：！？';
  var best = null, bestDiff = 1e9, any = null, anyDiff = 1e9;
  for (var c = 6; c < text.length - 4; c++){
    if (noStart.indexOf(text[c]) > -1) continue;
    var l1 = text.slice(0, c), l2 = text.slice(c);
    var w1 = ctx.measureText(l1).width, w2 = ctx.measureText(l2).width;
    if (w1 <= maxW && w2 <= maxW){
      var d = Math.abs(w1 - w2);
      if (d < anyDiff){ anyDiff = d; any = [l1, l2]; }
      if (marks.indexOf(text[c - 1]) > -1 && d < bestDiff){ bestDiff = d; best = [l1, l2]; }
    }
  }
  return best || any;
}
function rr(x, a, b, w, h, r){
  x.beginPath();
  x.moveTo(a + r, b);
  x.arcTo(a + w, b, a + w, b + h, r);
  x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r);
  x.arcTo(a, b, a + w, b, r);
  x.closePath();
}
function wrap(ctx, text, maxW){
  var lines = [], line = '';
  var noStart = '。，、」』！？：；）】…';
  for (var i = 0; i < text.length; i++){
    var ch = text[i];
    if (ctx.measureText(line + ch).width > maxW && line){
      if (noStart.indexOf(ch) > -1){ var extra = ch; while (i + 1 < text.length && noStart.indexOf(text[i + 1]) > -1){ extra += text[++i]; } lines.push(line + extra); line = ''; }
      else { lines.push(line); line = ch; }
    } else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function drawCard(){
  var b = getBand();
  var W = 1080, H = 1440;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var x = cv.getContext('2d');
  var F = '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
  var g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0d0d13'); g.addColorStop(.5, '#111118'); g.addColorStop(1, '#07070b');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  var lg = x.createLinearGradient(90, 0, W - 90, 0);
  lg.addColorStop(0, hexA(CFG.accent, .55)); lg.addColorStop(.55, hexA(CFG.accent, .12)); lg.addColorStop(1, hexA(CFG.accent, 0));
  x.fillStyle = lg; x.fillRect(90, 33, W - 180, 3);
  x.strokeStyle = 'rgba(255,255,255,.10)'; x.lineWidth = 2;
  rr(x, 34, 34, W - 68, H - 68, 34); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.32)';
  x.font = '700 30px ' + F;
  x.fillText(CFG.en + '   /   ' + CFG.no, 90, 132);
  x.fillStyle = CFG.accent;
  x.font = '800 148px ' + F;
  var num = b.pct + '%';
  x.fillText(num, 88, 332);
  var nw = x.measureText(num).width;
  x.fillStyle = 'rgba(255,255,255,.5)';
  x.font = '600 30px ' + F;
  x.fillText(CFG.unit, 92 + nw + 22, 332);
  var bx = 90, by = 384, bw = W - 180, bh = 14;
  rr(x, bx, by, bw, bh, 7); x.fillStyle = 'rgba(255,255,255,.08)'; x.fill();
  rr(x, bx, by, bw * b.pct / 100, bh, 7); x.fillStyle = CFG.accent; x.fill();
  x.fillStyle = '#ffffff';
  x.font = '800 96px ' + F;
  x.fillText(b.name, 88, 552);
  x.fillStyle = 'rgba(255,255,255,.80)';
  var qText = '「' + b.quote + '」';
  var qfs = 42, qLines = null, qlh = 68;
  while (qfs >= 30){
    x.font = '500 ' + qfs + 'px ' + F;
    qLines = balance(x, qText, 860);
    if (qLines){ qlh = Math.round(qfs * 1.62); break; }
    qfs -= 2;
  }
  if (!qLines){ x.font = '500 34px ' + F; qLines = wrap(x, qText, 860); qlh = 55; }
  var qy = 656;
  for (var i = 0; i < qLines.length; i++){ x.fillText(qLines[i], 90, qy); qy += qlh; }
  var py = qy + 14;
  x.font = '600 30px ' + F;
  var px = 90;
  for (var j = 0; j < b.tags.length; j++){
    var t = b.tags[j];
    var tw = x.measureText(t).width + 56;
    rr(x, px, py, tw, 64, 32);
    x.fillStyle = hexA(CFG.accent, .10); x.fill();
    x.strokeStyle = hexA(CFG.accent, .34); x.lineWidth = 2; x.stroke();
    x.fillStyle = CFG.accent;
    x.fillText(t, px + 28, py + 43);
    px += tw + 18;
  }
  var fy = py + 64 + 90;
  x.fillStyle = 'rgba(255,255,255,.13)';
  x.fillRect(90, fy - 54, 900, 1);
  x.fillStyle = 'rgba(255,255,255,.66)';
  x.font = '500 34px ' + F;
  var picks = [b.feat[0], b.feat[b.feat.length - 1]];
  for (var k = 0; k < picks.length; k++){
    var fl = wrap(x, picks[k], 880);
    if (fl.length > 2) fl = [fl[0], fl[1].slice(0, -1) + '…'];
    for (var m = 0; m < fl.length; m++){ x.fillText(fl[m], 90, fy); fy += 58; }
    fy += 18;
  }
  x.fillStyle = 'rgba(255,255,255,.30)';
  x.font = '600 28px ' + F;
  x.fillText(CFG.brand.name + '  ·  ' + CFG.brand.slogan, 90, H - 116);
  x.fillStyle = 'rgba(255,255,255,.18)';
  x.font = '500 24px ' + F;
  x.fillText('结果仅供娱乐 · 不构成心理诊断', 90, H - 70);
  return cv.toDataURL('image/png');
}
function saveCard(){
  var url = drawCard();
  document.getElementById('ovimg').src = url;
  document.getElementById('ov').classList.add('on');
}
function closeOv(){ document.getElementById('ov').classList.remove('on'); }
function copyShare(){
  var b = getBand();
  var txt = '我测出来是「' + b.name + '」——' + b.quote + '\n你也来试试：' + location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ alert('已复制，去粘贴吧'); }, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert('已复制，去粘贴吧'); } catch(e){ alert(txt); }
  document.body.removeChild(ta);
}
document.getElementById('brand').textContent = CFG.brand.name;
document.getElementById('brandSub').textContent = CFG.brand.slogan;
render();
</script>
</body>
</html>
